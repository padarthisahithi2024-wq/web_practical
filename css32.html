<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS 2D Transforms</title>
	<style>
		body { font-family: sans-serif; }
		.shape { display: inline-block; width: 110px; height: 110px; margin: 2rem; padding: 1rem; background: #a8dadc; }
		.rotate { transform: rotate(12deg); }
		.scale { transform: scale(1.2); }
		.translate { transform: translate(10px, 15px); }
		.skew { transform: skew(-12deg); }
	</style>
</head>
<body>
	<h1>2D transforms</h1>
	<div class="shape rotate">Rotate</div>
	<div class="shape scale">Scale</div>
	<div class="shape translate">Translate</div>
	<div class="shape skew">Skew</div>
</body>
</html>
