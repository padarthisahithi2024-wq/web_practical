<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Fonts</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .serif { font-family: Georgia, serif; font-size: 1.5rem; font-weight: bold; }
        .italic { font-style: italic; }
        .small-caps { font-variant: small-caps; }
    </style>
</head>
<body>
    <h1>Font properties</h1>
    <p class="serif">A bold Georgia paragraph with a larger font size.</p>
    <p class="italic">This sentence uses an italic font style.</p>
    <p class="small-caps">This sentence uses small caps.</p>
</body>
</html>
