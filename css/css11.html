<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Dimensions</title>
    <style>
        .dimensions { width: 60%; min-width: 240px; max-width: 700px; height: 180px; min-height: 120px; max-height: 300px; overflow: auto; margin: 2rem auto; padding: 1rem; background: #a8dadc; }
    </style>
</head>
<body>
    <section class="dimensions">
        <h1>Flexible dimensions</h1>
        <p>This box demonstrates width, height, minimum, and maximum dimensions.</p>
    </section>
</body>
</html>
