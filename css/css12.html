<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Box Sizing</title>
    <style>
        .box { width: 300px; padding: 20px; border: 10px solid #457b9d; margin: 1rem; background: #f1faee; }
        .content-box { box-sizing: content-box; }
        .border-box { box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>Box sizing comparison</h1>
    <div class="box content-box">content-box: padding and border are added to width.</div>
    <div class="box border-box">border-box: padding and border fit inside width.</div>
</body>
</html>
