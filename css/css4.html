<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Colors</title>
    <style>
        body { background: #f8f9fa; color: #264653; font-family: sans-serif; }
        .panel { background: #e9c46a; border: 4px solid #e76f51; padding: 1.5rem; }
        .button { display: inline-block; background: #2a9d8f; color: white; padding: .7rem 1rem; border-radius: 5px; }
    </style>
</head>
<body>
    <main class="panel">
        <h1>Color study</h1>
        <p>Colors style the page text, background, border, and button.</p>
        <a class="button" href="#">Action</a>
    </main>
</body>
</html>
