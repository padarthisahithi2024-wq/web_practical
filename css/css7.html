<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Gradients</title>
    <style>
        body { font-family: sans-serif; max-width: 850px; margin: 2rem auto; }
        .linear, .radial { min-height: 180px; padding: 2rem; margin: 1rem 0; color: white; }
        .linear { background: linear-gradient(120deg, #264653, #2a9d8f, #e9c46a); }
        .radial { background: radial-gradient(circle, #f4a261, #e76f51, #9b2226); }
    </style>
</head>
<body>
    <h1>Gradient examples</h1>
    <section class="linear"><h2>Linear gradient</h2></section>
    <section class="radial"><h2>Radial gradient</h2></section>
</body>
</html>
