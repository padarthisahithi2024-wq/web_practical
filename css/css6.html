<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Borders</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; }
        .box { padding: 1.25rem; margin: 1rem; border-width: 4px; }
        .solid { border-style: solid; border-color: #264653; border-radius: 4px; }
        .dashed { border-style: dashed; border-color: #e76f51; border-radius: 12px; }
        .dotted { border-style: dotted; border-color: #2a9d8f; border-radius: 50%; }
    </style>
</head>
<body>
    <h1>Border styles</h1>
    <div class="box solid">Solid border</div>
    <div class="box dashed">Dashed border</div>
    <div class="box dotted">Dotted border</div>
</body>
</html>
