<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS Unit Comparison</title>
	<style>
		body { font-family: sans-serif; font-size: 16px; }
		.em { font-size: 1.5em; padding: 1em; background: #e9c46a; }
		.rem { font-size: 1.5rem; padding: 1rem; background: #a8dadc; }
		.vw { width: 50vw; background: #f4a261; }
		.vh { height: 15vh; background: #e76f51; }
		.percent { width: 60%; background: #2a9d8f; color: white; }
	</style>
</head>
<body>
	<h1>em, rem, vw, vh, and percentage</h1>
	<div class="em">em sizing</div>
	<div class="rem">rem sizing</div>
	<div class="vw">vw width</div>
	<div class="vh">vh height</div>
	<div class="percent">percentage width</div>
</body>
</html>
