<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS Relative Units</title>
	<style>
		html { font-size: 16px; }
		body { margin: 0; font-family: sans-serif; }
		.hero { width: 80%; height: 45vh; min-height: 180px; padding: 2rem; background: #a8dadc; }
		h1 { font-size: 3rem; }
		p { width: 70%; min-width: 220px; }
	</style>
</head>
<body>
	<section class="hero">
		<h1>Percentage, viewport, and rem units</h1>
		<p>The section uses percentage width, viewport height, and rem-based text and spacing.</p>
	</section>
</body>
</html>
