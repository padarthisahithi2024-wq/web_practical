<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS Shadows</title>
	<style>
		body { font-family: sans-serif; background: #f8f9fa; padding: 2rem; }
		.card { max-width: 420px; padding: 2rem; background: white; box-shadow: 0 12px 30px rgba(0, 0, 0, .18); }
		h1 { color: #264653; text-shadow: 2px 2px 0 #e9c46a; }
		.soft { text-shadow: 0 1px 4px #6c757d; }
	</style>
</head>
<body>
	<article class="card">
		<h1>Shadow study</h1>
		<p class="soft">The card uses box-shadow while the heading and paragraph use text-shadow.</p>
	</article>
</body>
</html>
