<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Text Formatting</title>
    <style>
        body { font-family: sans-serif; line-height: 1.8; }
        h1 { text-align: center; text-transform: uppercase; letter-spacing: .15em; }
        .note { text-align: justify; text-indent: 2rem; word-spacing: .3rem; }
        .link { text-decoration: underline; text-decoration-color: #e76f51; }
    </style>
</head>
<body>
    <h1>Text formatting</h1>
    <p class="note">CSS controls alignment, decoration, transformation, indentation, spacing, and line height. This paragraph demonstrates several of those text properties together.</p>
    <p class="link">Decorated text uses a custom underline.</p>
</body>
</html>
