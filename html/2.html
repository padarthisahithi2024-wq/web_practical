<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>

<body>

    <h1>Types of Lists</h1>

    <h2>Ordered List</h2>

    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Bootstrap</li>
    </ol>

    <h2>Unordered List</h2>

    <ul>
        <li>Chennai</li>
        <li>Hyderabad</li>
        <li>Bangalore</li>
        <li>Mumbai</li>
    </ul>

    <h2>Description List</h2>

    <dl>
        <dt>HTML</dt>
        <dd>Used to create the structure of webpages.</dd>

        <dt>CSS</dt>
        <dd>Used to style webpages.</dd>

        <dt>JavaScript</dt>
        <dd>Used to add functionality to webpages.</dd>
    </dl>

</body>
</html>
