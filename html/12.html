<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>

        /* Universal Selector */
        * {
            box-sizing: border-box;
        }

        /* Element Selector */
        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
        }

        /* ID Selector */
        #heading {
            color: darkblue;
            text-align: center;
        }

        /* Class Selector */
        .text {
            color: green;
            font-size: 18px;
        }

        /* Attribute Selector */
        input[type="text"] {
            border: 2px solid blue;
            padding: 10px;
        }

        /* Grouping Selector */
        h2, h3 {
            color: purple;
        }

        .box {
            background-color: white;
            margin: 20px;
            padding: 25px;
            border: 3px solid black;
            border-radius: 10px;
        }

    </style>
</head>

<body>

    <h1 id="heading">CSS Selectors</h1>

    <div class="box">

        <h2>CSS Example</h2>

        <p class="text">
            CSS is used to style HTML webpages.
        </p>

        <h3>Student Name</h3>

        <input type="text" placeholder="Enter your name">

    </div>

</body>
</html>
