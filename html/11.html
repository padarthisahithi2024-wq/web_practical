<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="11-styles.css">
	<title>Internal and External CSS</title>
	<style>
		h1 {
			color: #1d3557;
		}

		.internal-note {
			padding: 1rem;
			border: 2px solid #e63946;
			background: #fff1e6;
		}
	</style>
</head>
<body>
	<h1>Two CSS sources</h1>
	<p class="external-note">This paragraph uses styles from the external 11-styles.css file.</p>
	<p class="internal-note">This paragraph uses styles from the internal style element above.</p>
</body>
</html>
