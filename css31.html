<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS Transitions</title>
	<style>
		body { font-family: sans-serif; }
		.button { background: #264653; color: white; padding: 1rem; border: 0; transition: background .3s, transform .3s, box-shadow .3s; }
		.button:hover { background: #e76f51; transform: translateY(-6px) scale(1.08); box-shadow: 0 10px 20px #adb5bd; }
	</style>
</head>
<body>
	<h1>Hover transition</h1>
	<button class="button">Move over me</button>
</body>
</html>
