<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Backgrounds</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            color: white;
            background-color: #264653;
            background-image: url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        main { padding: 20vh 2rem; text-align: center; }
    </style>
</head>
<body>
    <main>
        <h1>Background properties</h1>
        <p>This page demonstrates image, color, position, size, repeat, and attachment.</p>
    </main>
</body>
</html>
