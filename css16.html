<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rounded CSS Shapes</title>
	<style>
		body { font-family: sans-serif; padding: 2rem; }
		.card { width: 220px; padding: 1.5rem; border-radius: 18px; background: #a8dadc; display: inline-block; }
		.circle { width: 100px; height: 100px; border-radius: 50%; background: #e76f51; display: inline-block; vertical-align: middle; }
		.pill { padding: .7rem 1.5rem; border-radius: 999px; background: #2a9d8f; color: white; display: inline-block; }
		.custom { width: 130px; height: 100px; border-radius: 10% 50% 10% 50%; background: #e9c46a; display: inline-block; }
	</style>
</head>
<body>
	<h1>Rounded shapes</h1>
	<div class="card">Rounded card</div>
	<div class="circle" aria-label="Circle"></div>
	<span class="pill">Pill button</span>
	<div class="custom" aria-label="Custom rounded shape"></div>
</body>
</html>
