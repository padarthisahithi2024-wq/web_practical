<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS Cursors</title>
	<style>
		body { font-family: sans-serif; }
		.cursor { display: inline-block; padding: 1rem; margin: .5rem; border: 1px solid #457b9d; }
		.pointer { cursor: pointer; }
		.help { cursor: help; }
		.wait { cursor: wait; }
		.not-allowed { cursor: not-allowed; }
	</style>
</head>
<body>
	<h1>Cursor styles</h1>
	<button class="cursor pointer">Pointer</button>
	<span class="cursor help">Help</span>
	<span class="cursor wait">Wait</span>
	<span class="cursor not-allowed">Not allowed</span>
</body>
</html>
