<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Visibility and Opacity</title>
    <style>
        body { font-family: sans-serif; }
        .visible { padding: 1rem; background: #a8dadc; }
        .hidden { visibility: hidden; padding: 1rem; background: #e76f51; }
        .faded { opacity: .35; padding: 1rem; background: #e9c46a; }
        .transparent { opacity: 0; padding: 1rem; background: #2a9d8f; }
    </style>
</head>
<body>
    <h1>Visibility and opacity</h1>
    <p class="visible">Visible content</p>
    <p class="hidden">Hidden content still occupies space.</p>
    <p class="faded">Faded content uses opacity: .35.</p>
    <p class="transparent">Transparent content uses opacity: 0.</p>
</body>
</html>
