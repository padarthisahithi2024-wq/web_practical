<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Box Model</title>
    <style>
        .box { width: 240px; margin: 2rem auto; padding: 2rem; border: 8px solid #e76f51; background: #e9c46a; }
        .content { background: white; padding: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <div class="content">Content</div>
    </div>
    <p>The outer space is margin, then padding, border, and content.</p>
</body>
</html>
