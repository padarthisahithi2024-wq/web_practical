<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Selector Types</title>
    <style>
        * { box-sizing: border-box; }
        body, h1, p { margin: 1rem; }
        body { font-family: sans-serif; color: #264653; }
        .card { padding: 1rem; background: #e9f5db; }
        #featured { border: 3px solid #e76f51; }
        input[type="email"] { border: 2px solid #2a9d8f; padding: .5rem; }
        h1, .label { color: #1d3557; }
    </style>
</head>
<body>
    <h1>Selector Types</h1>
    <p class="label">Universal, element, class, ID, attribute, and grouping selectors.</p>
    <section id="featured" class="card">
        <p>Featured content</p>
        <input type="email" placeholder="student@example.com">
    </section>
</body>
</html>
