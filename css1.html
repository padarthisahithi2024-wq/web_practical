<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="css1-external.css">
	<title>Three Ways to Add CSS</title>
	<style>
		h1 {
			color: #264653;
			border-bottom: 2px solid #e9c46a;
		}

		.internal-note {
			padding: 1rem;
			background: #fff3bf;
		}
	</style>
</head>
<body>
	<h1>Inline, internal, and external CSS</h1>
	<p class="external-note">This paragraph is styled by css1-external.css.</p>
	<p class="internal-note">This paragraph is styled by the internal style element.</p>
	<p style="color: #e76f51; font-weight: bold;">This paragraph uses inline CSS.</p>
</body>
</html>
